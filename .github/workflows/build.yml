name: Build database

on:
  push:
  pull_request:

jobs:
  sqlserver:
    runs-on: ubuntu-latest
    env:
      SA_PASSWORD: ${{ secrets.SA_PASSWORD || 'Ci_Only_Passw0rd!' }}
    steps:
      - uses: actions/checkout@v4

      - name: Start SQL Server 2022
        run: |
          docker run -d --name mssql -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$SA_PASSWORD" \
            -v "$PWD/sql:/sql" mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 30); do
            docker exec mssql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PASSWORD" -Q "SELECT 1" >/dev/null 2>&1 && break
            sleep 2
          done

      - name: Create database
        run: docker exec mssql /opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -P "$SA_PASSWORD" -Q "CREATE DATABASE AnimalShelter"

      - name: Run scripts in order
        run: |
          for f in sql/*.sql; do
            echo "::group::$f"
            docker exec mssql /opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -P "$SA_PASSWORD" \
              -d AnimalShelter -W -s " | " -i "/$f"
            echo "::endgroup::"
          done
